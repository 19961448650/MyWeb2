<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>075朱雨露</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-size: 18px;
            font-weight: 400;
            color: #fff;
            list-style-type: none;
            text-decoration: none;
            box-sizing: border-box;
            font-family: 微软雅黑;
            line-height: 60px;
        }
        body{
            background-color: rgb(18, 118, 218);
        }
        .yijihezi{
            width: 120px;
            height: auto;
            margin: 54px 0 0 550px;
        }
        .yijiliebiao{
            width: 120px;
        }
        .yijiliebiao>li{
            width: 120px;
            height: 150px;
            position: relative;
        }
        li{
            display: flex;
            justify-content: center;
        }
        .erjihezi{
            position: absolute;
            left:120px;
            bottom:50px;
            background-color: rgb(255 255 255 / 0.8);
            padding: 0;
            width: 0;
            overflow: hidden;
            transition: all 300ms linear;
        }
        .erjihezi a{
            color: black;
            font-size: 16px;
            line-height: 40px;
        }
        .erjiliebiao{
            width: 120px;
        }
        .erjiliebiao>li{
            width: 120px;
            height:40px;
        }
        .yijiliebiao>li:hover .erjihezi{
            width: 360px;
            padding: 10px;
        }
        .yijiliebiao>li>a::after{
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 0;
            height: 60px;
            background-color: #bb1313;
            z-index: -1;
            transition: all 300ms linear;
}
        .yijiliebiao>li:hover a::after{
            width: 120px;
        }
    </style>
</head>
<body>
    <div class="yijihezi">
        <ul class="yijiliebiao">
            <li>
                <a href=" ">语文</a >
                <div class="erjihezi">
                    <ul class="erjiliebiao">
                        <li><a href="#">古诗</a ></li>
                        <li><a href="#">阅读</a ></li>
                        <li><a href="#">作文</a ></li>
                    </ul>
                </div>
            </li>
            <li>
                <a href="#">数学</a >
                <div class="erjihezi">
                    <ul class="erjiliebiao">
                        <li><a href="#">计算</a ></li>
                        <li><a href="#">几何</a ></li>
                        <li><a href="#">应用题</a ></li>
                    </ul>
                </div>
            </li>
            <li>
                <a href="#">英语</a >
                <div class="erjihezi">
                    <ul class="erjiliebiao">
                        <li><a href="#">单词</a ></li>
                        <li><a href="#">句子</a ></li>
                        <li><a href="#">阅读</a ></li>
                    </ul>
                </div>
            </li>
        </ul>
    </div>
</body>
</html>
